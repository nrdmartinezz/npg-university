name: Deploy target

on:
  workflow_call:
    inputs:
      site_url:
        description: Public site origin, no trailing slash required
        type: string
        required: true
      allow_indexing:
        description: Set to false, 0, or no to keep the site out of search engines
        type: string
        required: false
        default: ""
    secrets:
      ftp_host:
        required: true
      ftp_user:
        required: true
      ftp_password:
        required: true
      ftp_server_dir:
        required: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.site_url }}
      ALLOW_INDEXING: ${{ inputs.allow_indexing }}
      FTP_HOST: ${{ secrets.ftp_host }}
      FTP_USER: ${{ secrets.ftp_user }}
      FTP_PW: ${{ secrets.ftp_password }}
      FTP_SERVER_DIR: ${{ secrets.ftp_server_dir }}
    steps:
      - name: Check deploy settings
        run: |
          missing=0
          if [ -z "$FTP_HOST" ]; then
            echo "::error title=Missing FTP_HOST::Add the FTP_HOST secret to this GitHub environment."
            missing=1
          fi
          if [ -z "$FTP_USER" ]; then
            echo "::error title=Missing FTP_USER::Add the FTP_USER secret to this GitHub environment."
            missing=1
          fi
          if [ -z "$FTP_PW" ]; then
            echo "::error title=Missing FTP_PW::Add the FTP_PW secret to this GitHub environment."
            missing=1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error title=Missing SITE_URL::Add the SITE_URL variable to this GitHub environment."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Install PHPMailer
        run: composer install --no-dev --working-dir=public/api

      - name: Write robots.txt
        run: |
          site="${SITE_URL%/}"
          case "${ALLOW_INDEXING}" in
            false|0|no|off)
              printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
              ;;
            *)
              printf 'User-agent: *\nAllow: /\n\nDisallow: /thank-you/\nDisallow: /styleguide/\n\nSitemap: %s/sitemap-index.xml\n' "$site" > public/robots.txt
              ;;
          esac

      - name: Build
        run: npm run build

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PW }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR != '' && env.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**

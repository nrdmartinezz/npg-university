name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'staging' && 'staging' || 'production') }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'push' && github.ref_name == 'staging')
    environment: staging
    uses: ./.github/workflows/deploy-target.yml
    with:
      site_url: ${{ vars.SITE_URL }}
      allow_indexing: ${{ vars.ALLOW_INDEXING }}
    secrets:
      ftp_host: ${{ secrets.FTP_HOST }}
      ftp_user: ${{ secrets.FTP_USER }}
      ftp_password: ${{ secrets.FTP_PW }}

  production:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'push' && github.ref_name == 'main')
    environment: production
    uses: ./.github/workflows/deploy-target.yml
    with:
      site_url: ${{ vars.SITE_URL }}
      allow_indexing: ${{ vars.ALLOW_INDEXING }}
    secrets:
      ftp_host: ${{ secrets.FTP_SERVER }}
      ftp_user: ${{ secrets.FTP_USERNAME }}
      ftp_password: ${{ secrets.FTP_PASSWORD }}
      ftp_server_dir: ${{ secrets.FTP_SERVER_DIR }}
